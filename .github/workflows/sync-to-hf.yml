name: Sync to Hugging Face Spaces

on:
  push:
    branches:
      - claude/pinn-burgers-equation-CGuOc
  workflow_dispatch:  # 手動実行を許可

jobs:
  sync-to-huggingface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Gitの設定
          git config --global user.email "noreply@anthropic.com"
          git config --global user.name "Claude"

          # Hugging Faceリモートを追加（エラーを無視）
          git remote add hf https://jin3141:$HF_TOKEN@huggingface.co/spaces/jin3141/Pinn-test 2>/dev/null || true

          # 強制プッシュ（--verboseでデバッグ情報を出力）
          git push https://jin3141:$HF_TOKEN@huggingface.co/spaces/jin3141/Pinn-test HEAD:main --force --verbose
